# Khronos conformance tests packaged for VisionQuestPro: the Vulkan CTS (deqp-vk), built for
# Android arm64 exactly like a Quest game's native code, and packaged as an APK the app prepares
# and runs as one more game (guest kind "exe"). Published as the release "conformance"
# (VulkanCTS.apk). Linux runner only: no macOS minutes.
#
# Only when asked for: by hand (Actions > conformance > Run workflow) or a push whose commit
# message has [conformance] in it. The CTS sources, its dependencies and the compiler cache are
# cached per CTS version, so a rebuild only recompiles what changed.
name: conformance
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Qué compilar: all, vulkan u openxr"
        default: all
permissions:
  contents: write
jobs:
  vulkan-cts:
    if: (github.event_name == 'workflow_dispatch' && inputs.target != 'openxr') || contains(github.event.head_commit.message, '[conformance]')
    concurrency:
      group: conformance
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CTS_TAG: vulkan-cts-1.4.6.2
      ANDROID_API: "30"   # memfd_create (vktMemoryMapPlacedTests) is API 30; Quest 3 runs API 32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build ccache zip > /dev/null
          echo "NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PL=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)
          echo "AAPT2=$BT/aapt2" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$PL/android.jar" >> "$GITHUB_ENV"
          echo "build-tools $BT, platform $PL, NDK ${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"

      # Restore/save split so a failed build still keeps the sources and the compiler cache.
      - uses: actions/cache/restore@v4
        id: ctssrc
        with:
          path: cts
          key: vkcts-src-${{ env.CTS_TAG }}-v1
      - name: VK-GL-CTS ${{ env.CTS_TAG }} and its dependencies
        if: steps.ctssrc.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          git clone -q --depth 1 --branch "$CTS_TAG" https://github.com/KhronosGroup/VK-GL-CTS cts
          (cd cts && python3 external/fetch_sources.py 2>&1 | tail -40) | tee fetch.log

      - uses: actions/cache/save@v4
        if: steps.ctssrc.outputs.cache-hit != 'true'
        with:
          path: cts
          key: vkcts-src-${{ env.CTS_TAG }}-v1

      - name: Patches for the in-process executable
        run: python3 conformance/vulkan/patch_deqp.py cts

      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: vkcts-ccache-${{ env.CTS_TAG }}-${{ github.run_id }}
          restore-keys: vkcts-ccache-${{ env.CTS_TAG }}-

      - name: Configure (Android arm64 executable, Release)
        run: |
          set -o pipefail
          ccache -M 3G > /dev/null
          cmake -G Ninja -S cts -B build \
            -DDEQP_TARGET=android -DDEQP_TARGET_TOOLCHAIN=ndk-modern \
            -DANDROID_NDK_PATH="$NDK" -DANDROID_ABI=arm64-v8a -DDE_ANDROID_API="$ANDROID_API" \
            -DDEQP_ANDROID_EXE=ON -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            2>&1 | tail -60 | tee configure.log

      - name: Build deqp-vk
        run: |
          set -o pipefail
          cmake --build build --target deqp-vk deqp-vk-data -- -j"$(nproc)" -k 0 2>&1 \
            | grep -v "^\[[0-9]*/[0-9]*\] Building" | tail -400 | tee build.log
          ccache -s | tee -a build.log

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: vkcts-ccache-${{ env.CTS_TAG }}-${{ github.run_id }}

      - name: Package VulkanCTS.apk
        run: |
          set -euo pipefail
          EXE=build/external/vulkancts/modules/vulkan/deqp-vk
          DATA=build/external/vulkancts/modules/vulkan/vulkan
          test -f "$EXE" && test -d "$DATA"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mkdir -p pkg/lib/arm64-v8a pkg/assets
          cp "$EXE" pkg/lib/arm64-v8a/libdeqp-vk.so
          "$STRIP" --strip-unneeded pkg/lib/arm64-v8a/libdeqp-vk.so
          "$READELF" -h pkg/lib/arm64-v8a/libdeqp-vk.so | grep -E "Type|Machine" | tee package.log
          grep -o "export-dynamic-symbol=[a-z_]*" build/build.ninja | sort | uniq -c | tee -a package.log || true
          "$READELF" --dyn-syms -W pkg/lib/arm64-v8a/libdeqp-vk.so | grep -wE "vq_exe_main|main" | tee -a package.log || true
          "$READELF" --dyn-syms -W pkg/lib/arm64-v8a/libdeqp-vk.so | grep -qwE "vq_exe_main|main"
          "$READELF" -d pkg/lib/arm64-v8a/libdeqp-vk.so | grep NEEDED | tee -a package.log
          cp -R "$DATA" pkg/assets/vulkan
          python3 conformance/vulkan/caselists.py cts/external/vulkancts/mustpass/main pkg/assets/caselists | tee -a package.log
          sed "s/@VERSION@/${CTS_TAG#vulkan-cts-}/" conformance/vulkan/AndroidManifest.xml > pkg/AndroidManifest.xml
          "$AAPT2" link -o VulkanCTS.apk --manifest pkg/AndroidManifest.xml -I "$ANDROID_JAR"
          # Native code uncompressed (as Android stores it), data and lists deflated.
          (cd pkg && zip -q -0 -r ../VulkanCTS.apk lib && zip -q -9 -r ../VulkanCTS.apk assets)
          echo "files in data: $(find pkg/assets -type f | wc -l)" | tee -a package.log
          ls -la VulkanCTS.apk pkg/lib/arm64-v8a | tee -a package.log

      - name: Publish the logs (branch ci-logs, conformance.txt)
        if: always()
        run: bash scripts/ci-publish-log.sh conformance fetch.log configure.log build.log package.log

      - name: Publish VulkanCTS.apk as the release "conformance"
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete conformance --yes --cleanup-tag || true
          gh release create conformance VulkanCTS.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Tests oficiales de conformidad (Khronos)" \
            --notes "Vulkan CTS ${CTS_TAG#vulkan-cts-} (deqp-vk) para Android arm64, empaquetado como APK para VisionQuestPro. La app lo descarga desde Ajustes > Conformidad."

  # The OpenXR CTS (Khronos), the Android build exactly as Khronos ships it (gradle, NDK 23.2):
  # a NativeActivity APK (libconformance_test.so) that VisionQuestPro runs as a native game, with
  # its arguments passed as launch extras. Published as the release "conformance-openxr".
  openxr-cts:
    if: (github.event_name == 'workflow_dispatch' && inputs.target != 'vulkan') || contains(github.event.head_commit.message, '[conformance]')
    concurrency:
      group: conformance-openxr
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      XR_TAG: openxr-cts-1.1.58.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: NDK 23.2 and CMake 3.22 (the versions the CTS's gradle build names)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;23.2.8568313" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34" > /dev/null
      - name: OpenXR-CTS ${{ env.XR_TAG }}
        run: git clone -q --depth 1 --branch "$XR_TAG" https://github.com/KhronosGroup/OpenXR-CTS xrcts
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: xrcts-gradle-${{ env.XR_TAG }}
      - name: Build (assembleRelease, arm64)
        run: |
          set -o pipefail
          cd xrcts/src/conformance
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon -Pandroid.injected.build.abi=arm64-v8a assembleRelease 2>&1 \
            | grep -v "^> Task\|^\s*$" | tail -300 | tee ../../../build-xr.log
      - name: Package OpenXRCTS.apk
        run: |
          set -euo pipefail
          find xrcts -name '*.apk' | tee package-xr.log
          APK=$(find xrcts -name '*.apk' | grep -i release | head -1)
          test -n "$APK"
          cp "$APK" OpenXRCTS.apk
          unzip -l OpenXRCTS.apk | grep -E "lib/|AndroidManifest" | head -40 | tee -a package-xr.log
          ls -la OpenXRCTS.apk | tee -a package-xr.log
      - name: Publish the logs (branch ci-logs, conformance-openxr.txt)
        if: always()
        run: bash scripts/ci-publish-log.sh conformance-openxr build-xr.log package-xr.log
      - name: Publish OpenXRCTS.apk as the release "conformance-openxr"
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete conformance-openxr --yes --cleanup-tag || true
          gh release create conformance-openxr OpenXRCTS.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Test oficial de OpenXR (Khronos)" \
            --notes "OpenXR CTS ${XR_TAG#openxr-cts-} para Android arm64, tal como lo compila Khronos. La app lo descarga desde Ajustes > Conformidad."
