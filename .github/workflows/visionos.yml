# VisionQuestPro for Apple Vision Pro: Klepton's runtime + the launcher, VPKEngine's Vulkan driver
# (VPVulkan.framework, the default) and MoltenVK v1.4.2 (selectable in the app), VPKEngine's
# signature code. Unsigned IPA, published as the release "visionos" (VisionQuestPro.ipa).
#
# Gate: before the IPA is built, the macOS runner runs VPKEngine's gpu/ tests (host), a visionOS-SDK
# build of gpu/metal2, Klepton's host tests with ASan/UBSan and a -fsyntax-only pass over the whole
# runtime (tools/ci/). If any fails, the IPA is not published. Everything goes to the log (ci-logs).
#
# Only when asked for: by hand (Actions > visionos > Run workflow) or a push whose commit message
# has [build] in it. Klepton's runtime and MoltenVK are cached while their sources do not change.
name: visionos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  app:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    concurrency:
      group: visionos
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: VPKEngine (the signature code and the GPU layer)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/VPKEngine
          path: vpkengine
          ref: c6c0087d12484bf7d9f9853d336a03ccc4c8f17f
          fetch-depth: 1
          sparse-checkout: |
            runtime
            gpu
          sparse-checkout-cone-mode: true
      - name: Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version && cmake --version | head -1 && xcrun --sdk xros --show-sdk-version

      - uses: actions/cache@v4
        id: vpvk
        with:
          path: build/VPVulkan.framework
          key: vpvulkan-xros-${{ hashFiles('vpkengine/gpu/**', 'scripts/build-vpvulkan.sh') }}
      - name: VPVulkan.framework (VPKEngine's Vulkan driver for visionOS)
        if: steps.vpvk.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash scripts/build-vpvulkan.sh vpkengine build 2>&1 | tee vpvulkan.log

      - uses: actions/cache@v4
        id: mvk
        with:
          path: klepton/vendor-moltenvk/out
          key: moltenvk-xros-v1.4.2-${{ hashFiles('klepton/tools/mvk_fetch.sh', 'klepton/tools/mvk_retarget.sh') }}
      - name: MoltenVK v1.4.2
        if: steps.mvk.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cd klepton
          bash tools/mvk_fetch.sh
          bash tools/mvk_retarget.sh
          rm -rf vendor-moltenvk/dist vendor-moltenvk/*.tar

      - name: Syntax of the whole runtime (visionOS SDK, -fsyntax-only)
        run: |
          mkdir -p build
          # Never fails the step: the gate below does, after the app has reported its own errors too.
          set -o pipefail
          bash tools/ci/syntax-xros.sh 2>&1 | tee syntax.log || echo syntax >> build/ci-failed

      - name: Tests (VPKEngine gpu, metal2 for visionOS, Klepton with ASan/UBSan)
        run: |
          mkdir -p build
          set -o pipefail
          bash tools/ci/host-tests.sh vpkengine build/host-tests 2>&1 | tee tests.log || echo tests >> build/ci-failed

      - uses: actions/cache@v4
        id: rt
        with:
          path: klepton/build/xros/libklepton.a
          key: libklepton-xros-${{ hashFiles('klepton/runtime/**', 'klepton/Makefile') }}-mvk142
      - name: Klepton runtime (libklepton.a for visionOS)
        if: steps.rt.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cd klepton
          # Do not fail the step, so "The app" still reports its errors (it needs libklepton.a for BUILD SUCCEEDED).
          make -j1 build/xros/libklepton.a XROS_PLATFORMS=xros 2>&1 | tee ../runtime.log || echo "::error::libklepton.a failed"

      - name: Apple's certificates (the chain a signed library carries)
        run: |
          mkdir -p build/VPKEngineCertificates
          for C in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6; do
            curl -sSfL --retry 4 --retry-delay 5 -o build/VPKEngineCertificates/$C.cer https://www.apple.com/certificateauthority/$C.cer || echo "no $C"
          done
          curl -sSfL --retry 4 --retry-delay 5 -o build/VPKEngineCertificates/AppleRootCA-G3.cer https://www.apple.com/certificateauthority/AppleRootCA-G3.cer || true
          curl -sSfL --retry 4 --retry-delay 5 -o build/VPKEngineCertificates/AppleIncRootCertificate.cer https://www.apple.com/appleca/AppleIncRootCertificate.cer
          ls -la build/VPKEngineCertificates

      - name: The app
        run: |
          set -o pipefail
          brew install xcodegen || true
          printf '// Written by CI.\nlet vqReleaseRepository = "%s"\nlet vqBuildCommit = "%s"\n' "$GITHUB_REPOSITORY" "${GITHUB_SHA::7}" > app/Sources/VQBuildInfo.swift
          xcodegen generate --spec project.yml
          xcodebuild -project VisionQuestPro.xcodeproj -scheme VisionQuestPro \
            -sdk xros -configuration Release -destination 'generic/platform=visionOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > app.log 2>&1 || true
          grep -E 'error:|BUILD (SUCCEEDED|FAILED)' app.log | head -60 || true
          grep -q 'BUILD SUCCEEDED' app.log
          APP=$(find build/dd/Build/Products -name 'VisionQuestPro.app' -maxdepth 3 | head -n 1)
          ls -la "$APP" "$APP/Frameworks" | tee -a app.log
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../VisionQuestPro.ipa Payload)
          ls -la build/VisionQuestPro.ipa

      - name: Public API of CompositorServices (frame rate; informational, never fails the build)
        continue-on-error: true
        run: |
          {
            SDK=$(xcrun --sdk xros --show-sdk-path 2>&1) || true
            echo "sdk: $SDK"
            for FW in CompositorServices RealityKit SwiftUI; do
              DIR="$SDK/System/Library/Frameworks/$FW.framework"
              echo; echo "=== $FW.framework ==="
              FILES=$(find "$DIR" -name '*.swiftinterface' ! -name '*.private.swiftinterface' 2>/dev/null | grep -i -E 'xros|visionos' | head -n 4) || true
              [ -n "$FILES" ] || echo "(no .swiftinterface found)"
              for F in $FILES; do
                echo; echo "--- $F ($(wc -l < "$F") lines)"
                grep -n -i -E 'frame ?rate|refresh|FrameRepeat|preferred|Hz|cadence|frameInterval' "$F" | head -n 300 || true
                if [ "$FW" = CompositorServices ]; then
                  echo; echo "--- LayerRenderer.Configuration (block)"
                  awk '/struct Configuration|class Configuration|protocol CompositorLayerConfiguration/{p=1} p{print NR": "$0; n++} n>160{exit}' "$F" || true
                fi
              done
            done
            echo; echo "=== headers (CompositorServices) ==="
            grep -rn -i -E 'frame ?rate|refresh|FrameRepeat|preferred|cadence|frameInterval' "$SDK/System/Library/Frameworks/CompositorServices.framework/Headers" 2>/dev/null | head -n 100 || true
          } > compositor-api.txt 2>&1 || true
          wc -l compositor-api.txt || true

      - name: Gate (no tests or syntax errors, or no IPA)
        run: |
          if [ -f build/ci-failed ]; then
            echo "::error::failed: $(tr '\n' ' ' < build/ci-failed)(see tests.log / syntax.log)"
            exit 1
          fi
          echo "tests and syntax: OK"

      - name: Publish the logs (branch ci-logs, visionos.txt)
        if: always()
        run: bash scripts/ci-publish-log.sh visionos syntax.log tests.log vpvulkan.log runtime.log app.log compositor-api.txt

      - name: Publish the app as a release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete visionos --yes --cleanup-tag || true
          gh release create visionos build/VisionQuestPro.ipa \
            --target "$GITHUB_SHA" --prerelease \
            --title "VisionQuestPro para Apple Vision Pro" \
            --notes "App sin firmar, compilada de ${GITHUB_SHA::7}. Klepton + launcher con conversión en el visor; Vulkan con VPKEngine (VPVulkan) por defecto, MoltenVK seleccionable en ajustes."
